<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHI STORE</title>
<meta name="description" content="SHI STORE ร้านค้าออนไลน์">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">SHI STORE</div>
  <nav>
    <button data-view="shop">สินค้า</button>
    <button data-view="wallet">กระเป๋าเงิน</button>
    <button data-view="orders">คำสั่งซื้อ</button>
    <button data-view="account">บัญชี</button>
    <button id="adminBtn" class="hidden" data-view="admin">แอดมิน</button>
  </nav>
  <div class="head-actions">
    <span id="userLabel">ยังไม่ได้เข้าสู่ระบบ</span>
    <button id="authBtn">เข้าสู่ระบบ</button>
    <button id="musicBtn">♫</button>
  </div>
</header>

<main>
<section id="shop" class="view active">
  <div id="banners" class="banners"></div>
  <div class="toolbar">
    <input id="search" placeholder="ค้นหาสินค้า...">
    <select id="category"><option value="">ทุกหมวดหมู่</option></select>
  </div>
  <div id="products" class="grid"></div>
</section>

<section id="wallet" class="view">
  <div class="card wallet-card">
    <h2>กระเป๋าเงิน</h2>
    <div id="balance" class="balance">฿0.00</div>
    <div class="row">
      <button class="primary" onclick="openModal('topupModal')">เติมเงิน</button>
      <button onclick="openModal('withdrawModal')">ถอนเงิน</button>
    </div>
  </div>
  <div class="card"><h3>ประวัติรายการ</h3><div id="transactions"></div></div>
</section>

<section id="orders" class="view">
  <div class="card"><h2>คำสั่งซื้อของฉัน</h2><div id="ordersList"></div></div>
</section>

<section id="account" class="view">
  <div class="card"><h2>บัญชีของฉัน</h2><form id="profileForm">
    <label>ชื่อ<input id="fullName"></label>
    <label>เบอร์โทร<input id="phone"></label>
    <button class="primary">บันทึก</button>
  </form></div>
  <div class="card"><h3>ที่อยู่จัดส่ง</h3><button onclick="openModal('addressModal')">เพิ่มที่อยู่</button><div id="addresses"></div></div>
</section>

<section id="admin" class="view">
  <div class="admin-tabs">
    <button data-admin="topups">เติมเงิน</button>
    <button data-admin="withdrawals">ถอนเงิน</button>
    <button data-admin="products">สินค้า</button>
    <button data-admin="payments">บัญชีรับเงิน</button>
    <button data-admin="orders">คำสั่งซื้อ</button>
    <button data-admin="banners">แบนเนอร์</button>
  </div>
  <div id="adminContent" class="card"></div>
</section>
</main>

<div id="cart" class="cart"><div class="cart-title">ตะกร้า <button onclick="toggleCart()">×</button></div><div id="cartItems"></div><div class="cart-total">รวม <b id="cartTotal">฿0.00</b></div><button class="primary full" onclick="checkout()">ไปชำระเงิน</button></div>

<div id="authModal" class="modal"><div class="modal-box"><button class="x" onclick="closeModal('authModal')">×</button>
<h2 id="authTitle">เข้าสู่ระบบ</h2><form id="authForm">
<input id="authEmail" type="email" placeholder="อีเมล" required>
<input id="authPassword" type="password" placeholder="รหัสผ่าน" minlength="6" required>
<input id="authName" placeholder="ชื่อ (เฉพาะสมัครสมาชิก)" class="hidden">
<button class="primary full" id="authSubmit">เข้าสู่ระบบ</button></form>
<button class="link" id="switchAuth">ยังไม่มีบัญชี? สมัครสมาชิก</button>
</div></div>

<div id="topupModal" class="modal"><div class="modal-box"><button class="x" onclick="closeModal('topupModal')">×</button>
<h2>เติมเงิน</h2><div id="paymentAccounts"></div>
<form id="topupForm"><select id="paymentSelect" required></select><input id="topupAmount" type="number" min="1" step="0.01" placeholder="จำนวนเงิน" required><input id="slip" type="file" accept="image/*" required><button class="primary full">ส่งรายการเติมเงิน</button></form>
<p class="muted">โอนเงินสำหรับซื้อสินค้า แล้วแนบสลิปเพื่อรอแอดมินตรวจสอบ</p></div></div>

<div id="withdrawModal" class="modal"><div class="modal-box"><button class="x" onclick="closeModal('withdrawModal')">×</button>
<h2>ถอนเงิน</h2><form id="withdrawForm"><input id="wdProvider" placeholder="ธนาคาร/ผู้ให้บริการ" required><input id="wdName" placeholder="ชื่อบัญชี" required><input id="wdNumber" placeholder="เลขบัญชี" required><input id="wdAmount" type="number" min="1" step="0.01" placeholder="จำนวนเงิน" required><button class="primary full">ส่งคำขอถอนเงิน</button></form></div></div>

<div id="addressModal" class="modal"><div class="modal-box"><button class="x" onclick="closeModal('addressModal')">×</button>
<h2>เพิ่มที่อยู่</h2><form id="addressForm">
<input id="addrName" placeholder="ชื่อผู้รับ" required><input id="addrPhone" placeholder="เบอร์โทร" required><textarea id="addrLine" placeholder="บ้านเลขที่/ถนน" required></textarea><input id="addrSub" placeholder="ตำบล/แขวง" required><input id="addrDist" placeholder="อำเภอ/เขต" required><input id="addrProv" placeholder="จังหวัด" required><input id="addrZip" placeholder="รหัสไปรษณีย์" required><label class="check"><input id="addrDefault" type="checkbox"> ตั้งเป็นที่อยู่หลัก</label><button class="primary full">บันทึก</button></form></div></div>

<div id="checkoutModal" class="modal"><div class="modal-box"><button class="x" onclick="closeModal('checkoutModal')">×</button><h2>ยืนยันคำสั่งซื้อ</h2><div id="checkoutSummary"></div><select id="addressSelect" required></select><button class="primary full" onclick="placeOrder()">ยืนยันสั่งซื้อและหักเงินจากกระเป๋า</button></div></div>

<div id="toast"></div>
<audio id="bgm" loop src="ssstik.io_1788973689173.mp3"></audio>
<script>window.SHI_CONFIG={SUPABASE_URL: + supabase_url + r,SUPABASE_KEY: + supabase_key + r,TOPUP_FUNCTION:"wallet-topup-review",WITHDRAW_FUNCTION:"wallet-withdrawal-review"};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body></html>
